name: Обновить расписание квизов

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Запустить сборщик
        run: python scrape.py

      - name: Закоммитить schedule.json
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add schedule.json
          git diff --quiet --cached || git commit -m "Обновление расписания квизов"
          git push
