name: Обновить расписание квизов

on:
  schedule:
    # каждые 6 часов (время UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write  # нужно, чтобы workflow мог закоммитить обновлённый schedule.json

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Запустить сборщик
        run: python scrape.py

      - name: Выгрузить debug-файлы как артефакт
        if: always()  # выгружаем, даже если предыдущий шаг упал с ошибкой
        uses: actions/upload-artifact@v7
        with:
          name: debug-files
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Закоммитить schedule.json
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add schedule.json
          git diff --quiet --cached || git commit -m "Обновление расписания квизов"
          git push
